<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / theme -->
    <meta name="theme-color" content="#0f0f13" />
    <meta name="application-name" content="Jez30" />
    <meta name="description" content="Personal workout tracker for Jez" />

    <!-- iOS PWA — makes "Add to Home Screen" launch full-screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jez30" />
    <link rel="apple-touch-icon" href="/Jez30/apple-touch-icon.png" />

    <!-- Prevent phone-number auto-detection on iOS -->
    <meta name="format-detection" content="telephone=no" />

    <title>Jez30</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
